# Workflow Eleventy → GitHub Pages (PAS Jekyll)
# Réglage requis : Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Audit code (npm + blog + assets)
        run: npm run audit:code

      - name: Audit exemples (noindex longue traîne)
        run: npm run audit:exemples

      - name: Build
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_PLACE_ID: ${{ secrets.GOOGLE_PLACES_PLACE_ID }}
        run: npm run build

      - name: Test migration blog redirects (mapping + HTML)
        run: npm run test:blog-migration

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test URLs en production
        run: |
          set -e
          sleep 30
          URLS=(
            "https://redkmotors.fr/"
            "https://redkmotors.fr/mecanique/"
            "https://redkmotors.fr/carrosserie/"
            "https://redkmotors.fr/entretien/"
            "https://redkmotors.fr/pneumatiques/"
            "https://redkmotors.fr/achat-revente/"
            "https://redkmotors.fr/location/"
            "https://redkmotors.fr/contact/"
            "https://redkmotors.fr/tarifs/"
            "https://redkmotors.fr/blog/"
          )
          FAILED=0

          check_seo_asset() {
            local url="$1"
            local pattern="$2"
            local label="$3"
            response=$(curl -sSL --max-redirs 3 -w "\n%{http_code}" "$url")
            body=$(echo "$response" | head -n -1)
            code=$(echo "$response" | tail -n 1)
            if [ "$code" != "200" ]; then
              echo "❌ $label → HTTP $code"
              FAILED=1
            elif ! echo "$body" | grep -q "$pattern"; then
              echo "❌ $label → contenu invalide (attendu: $pattern)"
              FAILED=1
            else
              echo "✅ $label → 200 OK"
            fi
          }

          for url in "${URLS[@]}"; do
            response=$(curl -sSL --max-redirs 3 -w "\n%{http_code}" "$url")
            body=$(echo "$response" | head -n -1)
            code=$(echo "$response" | tail -n 1)
            if [ "$code" != "200" ]; then
              echo "❌ $url → HTTP $code"
              FAILED=1
            elif echo "$body" | grep -q "Cette page a été déplacée"; then
              echo "❌ $url → contient le template de redirection (régression)"
              FAILED=1
            else
              echo "✅ $url → 200 OK"
            fi
          done

          check_seo_asset "https://redkmotors.fr/sitemap.xml" "<sitemapindex" "sitemap.xml (index)"
          check_seo_asset "https://redkmotors.fr/sitemap-pages.xml" "<urlset" "sitemap-pages.xml"
          check_seo_asset "https://redkmotors.fr/sitemap-blog.xml" "<urlset" "sitemap-blog.xml"
          check_seo_asset "https://redkmotors.fr/sitemap-exemples.xml" "<urlset" "sitemap-exemples.xml"
          check_seo_asset "https://redkmotors.fr/sitemap-pages.xml" "redkmotors.fr/contact/" "sitemap-pages (contact)"
          check_seo_asset "https://redkmotors.fr/robots.txt" "Sitemap: https://redkmotors.fr/sitemap.xml" "robots.txt (sitemap)"
          check_seo_asset "https://redkmotors.fr/robots.txt" "GPTBot" "robots.txt (crawlers IA)"
          check_seo_asset "https://redkmotors.fr/robots.txt" "User-agent: *" "robots.txt (syntaxe EN)"
          check_seo_asset "https://redkmotors.fr/robots.txt" "LLMs-Txt:" "robots.txt (GEO llms)"
          check_seo_asset "https://redkmotors.fr/robots.txt" "Bingbot" "robots.txt (Bing/Copilot)"
          check_seo_asset "https://redkmotors.fr/llms.txt" "RED-K MOTORS" "llms.txt"
          check_seo_asset "https://redkmotors.fr/llms.txt" "SIRET" "llms.txt (SIRET)"
          check_seo_asset "https://redkmotors.fr/llms-full.txt" "RED-K MOTORS" "llms-full.txt"
          check_seo_asset "https://redkmotors.fr/ai.txt" "Llms-Txt:" "ai.txt"
          check_seo_asset "https://redkmotors.fr/" "fonts-local.css" "fonts self-hosted (fonts-local.css)"
          check_seo_asset "https://redkmotors.fr/" "logo-redk-motors.webp" "logo WebP (picture)"

          # Migration blog : nouvelles URL doivent répondre 200
          BLOG_NEW=(
            "https://redkmotors.fr/blog/articles/suppression-fap-controle-technique-2026/"
            "https://redkmotors.fr/blog/articles/prix-recharge-climatisation-94/"
            "https://redkmotors.fr/blog/articles/revision-60000-km-checklist/"
            "https://redkmotors.fr/blog/articles/combien-coute-vidange-voiture/"
          )
          for url in "${BLOG_NEW[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            if [ "$code" != "200" ]; then
              echo "❌ blog new $url → HTTP $code"
              FAILED=1
            else
              echo "✅ blog new $url → 200"
            fi
          done

          # Anciennes URL : 301 unique vers /blog/articles/… (nécessite KV Worker à jour)
          BLOG_OLD_MAP=(
            "https://redkmotors.fr/blog/suppression-fap-controle-technique-2026/|https://redkmotors.fr/blog/articles/suppression-fap-controle-technique-2026/"
            "https://redkmotors.fr/blog/prix-recharge-climatisation-94/|https://redkmotors.fr/blog/articles/prix-recharge-climatisation-94/"
            "https://redkmotors.fr/blog/revision-60000-km-checklist/|https://redkmotors.fr/blog/articles/revision-60000-km-checklist/"
            "https://redkmotors.fr/blog/combien-coute-vidange-voiture/|https://redkmotors.fr/blog/articles/combien-coute-vidange-voiture/"
          )
          for entry in "${BLOG_OLD_MAP[@]}"; do
            old="${entry%%|*}"
            expect="${entry##*|}"
            headers=$(curl -sSI --max-redirs 0 --max-time 20 "$old" || true)
            code=$(echo "$headers" | tr -d '\r' | awk 'BEGIN{c=""} /^HTTP/{c=$2} END{print c}')
            loc=$(echo "$headers" | tr -d '\r' | awk 'BEGIN{l=""} tolower($1)=="location:"{l=$2} END{print l}')
            if [ "$code" = "301" ] && [ "$loc" = "$expect" ]; then
              echo "✅ blog old 301 $old → $loc"
            elif [ "$code" = "404" ]; then
              echo "⚠ blog old encore 404 $old — publier KV Worker (npm run redirects:kv-shards + wrangler kv put)"
              # Ne bloque pas le deploy Pages : le HTML est correct, KV est une étape manuelle
            else
              echo "❌ blog old $old → HTTP $code Location=$loc (attendu 301 $expect)"
              FAILED=1
            fi
          done

          sec_headers=$(curl -sSL --max-redirs 3 -I "https://redkmotors.fr/")
          if echo "$sec_headers" | grep -qi "x-content-type-options: nosniff"; then
            echo "✅ headers sécu → X-Content-Type-Options nosniff"
          else
            echo "⚠ headers sécu → manquant (déployer Worker : npm run cf:deploy-headers)"
          fi

          response=$(curl -sSL --max-redirs 3 -w "\n%{http_code}" -I "https://redkmotors.fr/assets/fonts/manrope-latin-400-normal.woff2")
          code=$(echo "$response" | tail -n 1)
          headers=$(echo "$response" | head -n -1)
          if [ "$code" != "200" ]; then
            echo "❌ font woff2 → HTTP $code"
            FAILED=1
          elif echo "$headers" | grep -qi "immutable"; then
            echo "✅ font woff2 → cache immutable"
          else
            echo "⚠ font woff2 → cache court (Worker headers non déployé)"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Smoke test failed"
            exit 1
          fi
          echo "Tous les smoke tests sont passés ✅"

  indexnow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: smoke-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: IndexNow — URLs prioritaires (money + hubs)
        env:
          SITE_URL: https://redkmotors.fr
          INDEXNOW_KEY: 315a9d29deec456a9cd2ae11fe67e677
        run: node scripts/indexnow-priority.js

      - name: IndexNow — sitemap complet
        env:
          SITE_URL: https://redkmotors.fr
          INDEXNOW_KEY: 315a9d29deec456a9cd2ae11fe67e677
        run: node scripts/indexnow-ping.js
