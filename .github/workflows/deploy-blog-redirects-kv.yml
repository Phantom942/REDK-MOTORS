# Déploie les shards KV + Worker redirects blog — DÉCLENCHEMENT MANUEL UNIQUEMENT.
#
# Secret : CLOUDFLARE_API_TOKEN
#   Account — Workers Scripts:Edit
#   Account — Workers KV Storage:Edit
#
# Ordre sécurisé :
#   1) Build + tests
#   2) Backup KV distant (obligatoire) → échoue = stop
#   3) Artefact GitHub du backup (obligatoire) → avant tout upload
#   4) Upload shards + deploy Worker
#   5) Verify --all --strict (234 anciennes + 78 nouvelles + 11 conservés)
#
# Rollback : mode=rollback + run_id de l’artefact kv-backup-*.
name: Deploy blog redirects KV

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy = upload KV ; rollback = restaurer depuis un artefact"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      rollback_run_id:
        description: "Rollback uniquement — run_id GitHub Actions contenant l’artefact kv-backup-*"
        required: false
        type: string
        default: ""
      deploy_worker:
        description: "Redeploy Worker JS (mode deploy)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: write

jobs:
  deploy-kv:
    if: github.repository == 'Phantom942/REDK-MOTORS' && inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build + generate redirects / shards
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_PLACE_ID: ${{ secrets.GOOGLE_PLACES_PLACE_ID }}
        run: |
          npm run build
          npm run test:blog-migration
          npm run redirects:kv-shards

      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent — impossible de continuer"
            exit 1
          fi

      - name: Backup KV distant (obligatoire)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/deploy-kv-shards.js --backup-only --dir workers/kv-backup
          test -f workers/kv-backup/manifest.json
          test -s workers/kv-backup/manifest.json
          echo "Backup local OK — $(find workers/kv-backup -type f | wc -l) fichier(s)"

      - name: Publier artefact backup (avant tout upload)
        uses: actions/upload-artifact@v4
        with:
          name: kv-backup-${{ github.run_id }}
          path: workers/kv-backup/
          retention-days: 30
          if-no-files-found: error

      - name: Upload KV shards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-kv-shards.js --upload-only

      - name: Deploy Worker
        if: inputs.deploy_worker == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy-headers

      - name: Verify production redirects (all + strict)
        env:
          SITE_URL: https://redkmotors.fr
          VERIFY_BLOG_REDIRECTS_STRICT: "1"
        run: |
          set -euo pipefail
          # Propagation KV
          sleep 20
          node scripts/verify-blog-redirects-prod.js --all --strict

      - name: Rollback hint on failure
        if: failure()
        run: |
          echo "::error::Déploiement ou vérif échoué. Rollback :"
          echo "  Actions → Deploy blog redirects KV → Run workflow"
          echo "  mode=rollback , rollback_run_id=${{ github.run_id }}"
          echo "Artefact : kv-backup-${{ github.run_id }}"

  rollback-kv:
    if: github.repository == 'Phantom942/REDK-MOTORS' && inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Require inputs + token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent"
            exit 1
          fi
          if [ -z "${{ inputs.rollback_run_id }}" ]; then
            echo "::error::rollback_run_id requis (run_id de l’artefact kv-backup-*)"
            exit 1
          fi

      - name: Télécharger artefact backup
        uses: actions/download-artifact@v4
        with:
          name: kv-backup-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: workers/kv-backup

      - name: Restore KV depuis backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -f workers/kv-backup/manifest.json
          node scripts/deploy-kv-shards.js --restore --dir workers/kv-backup

      - name: Verify production after rollback
        env:
          SITE_URL: https://redkmotors.fr
          VERIFY_BLOG_REDIRECTS_STRICT: "1"
        run: |
          sleep 15
          # Après rollback les anciennes URL migrées peuvent re-404 :
          # on vérifie au moins que les 11 conservés + chemins critiques restent 200
          node -e "
          const kept = require('./scripts/lib/blog-article-redirects.js').classifyArticles().kept;
          (async () => {
            let failed = 0;
            for (const { permalink } of kept) {
              const res = await fetch('https://redkmotors.fr' + permalink, { redirect: 'manual' });
              console.log(res.status, permalink);
              if (res.status !== 200) failed++;
            }
            const home = await fetch('https://redkmotors.fr/', { redirect: 'manual' });
            console.log(home.status, '/');
            if (home.status !== 200) failed++;
            if (failed) process.exit(1);
            console.log('Rollback verify kept+home OK');
          })();
          "
